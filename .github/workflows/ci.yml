# Her push ve pull request'te kod kalitesini ve testleri otomatik kontrol eder.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI'da veritabanı yoksa db testleri atlanmasın, hata versin
      CI_DB_ZORUNLU: "1"
    services:
      # Testler için GitHub'ın sunucusunda geçici bir pgvector veritabanı
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kobi
          POSTGRES_PASSWORD: kobi_sifre
          POSTGRES_DB: kobi_asistan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kobi -d kobi_asistan"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: pip install -e ".[dev]"
      - name: pgvector eklentisini aç
        run: psql "postgresql://kobi:kobi_sifre@localhost:5432/kobi_asistan" -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Kod düzeni (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Testler (pytest)
        run: pytest -v
