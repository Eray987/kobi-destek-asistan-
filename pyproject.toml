[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kobi-asistan"
version = "0.1.0"
description = "Document-grounded Turkish customer support assistant for SMEs (RAG)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Embedding models (pulls in PyTorch, ~1 GB). Not needed for the unit tests or CI.
ml = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: tests that need a running PostgreSQL + pgvector (docker compose up -d)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: basic errors, I: import order, UP: modern Python, B: common bugs
select = ["E", "F", "I", "UP", "B"]
