[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kobi-asistan"
version = "0.1.0"
description = "KOBİ'ler için Türkçe, doküman tabanlı müşteri destek asistanı (RAG)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: Çalışan bir PostgreSQL + pgvector gerektiren testler (docker compose up -d)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: temel hatalar, I: import sırası, UP: modern Python, B: sık yapılan hatalar
select = ["E", "F", "I", "UP", "B"]
